version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: terraiq
      POSTGRES_PASSWORD: terraiqpass
      POSTGRES_DB: terraiqdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "terraiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15.0
    environment:
      - NEO4J_AUTH=neo4j/terraiqpass
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=terraiq
      - CLICKHOUSE_PASSWORD=terraiqpass
      - CLICKHOUSE_DB=telemetry
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=terraiqdb
      - DB_POSTGRESDB_USER=terraiq
      - DB_POSTGRESDB_PASSWORD=terraiqpass
    depends_on:
      - postgres

  fastapi:
    build:
      context: ./api/fastapi
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - kafka
      - neo4j
      - qdrant
      - clickhouse
      - rabbitmq
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://terraiq:terraiqpass@postgres:5432/terraiqdb
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKER_URL=kafka:9092
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=terraiqpass
      - QDRANT_URL=http://qdrant:6333
      - CLICKHOUSE_HOST=clickhouse
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FRONTEND_BASE_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,https://terraiq.me,https://www.terraiq.me
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

  frontend:
    build:
      context: ./frontend/next-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  worker:
    build:
      context: ./event/worker
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - postgres
      - rabbitmq
    environment:
      - DATABASE_URL_ASYNC=postgresql+asyncpg://terraiq:terraiqpass@postgres:5432/terraiqdb
      - KAFKA_BROKER_URL=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

volumes:
  pgdata:
  clickhouse_data:
